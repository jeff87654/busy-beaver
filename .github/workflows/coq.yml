  bb7:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb7 == 'true'
    # BB7/: champ_231 1RB0RG_1RC1RB_0RD---_0LE0LD_0LF1LE_1RA1LF_0LD0RB and its twin champ_232 (G0 = 1LC): halting, the
    # exact score 2 * W 20 5 + 7 and 3^^20 3 < sigma, for both machines (about 25 minutes, mostly the two start-ups).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
