name: Coq proofs

# Builds busycoq at the pinned commit with Coq 8.20.1 and checks the proofs of each entry: BB8/verify, BB8/verify_m8,
# BB9/verify_fw2 (stage 1), BB9/verify_c04, BB13/, BB14/, BB43/, PA/m238 and ZF/. BB10/, BB12/ and stage 2 of BB9/verify_fw2 take hours and are not
# built here.
#
# When the jobs run: on pull requests and on pushes to main, a job runs only if its entry's files changed (job `changes`,
# below; a skipped job counts as passed). Changes under .github/ (this file, the busycoq pin) run every job, and so do
# the weekly scheduled run and manual runs (workflow_dispatch).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC: everything

jobs:
  changes:
    # Which entries a pull request or push touches. An entry's job also runs when an entry it depends on changes:
    # BB9/verify_c04 uses copies of BB9/verify_fw2/multifile files (checked byte for byte), so it runs when those change;
    # BB8/verify_m8 is built on BB9/verify_c04 and BB8/verify, so it runs when any of those change.
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.all.outputs.all }}
      pa238: ${{ steps.f.outputs.pa238 }}
      bb8: ${{ steps.f.outputs.bb8 }}
      bb8-m8: ${{ steps.f.outputs.bb8-m8 }}
      bb13-bb14: ${{ steps.f.outputs.bb13-bb14 }}
      bb9-fw2: ${{ steps.f.outputs.bb9-fw2 }}
      bb9-c04: ${{ steps.f.outputs.bb9-c04 }}
      bb43: ${{ steps.f.outputs.bb43 }}
      zf: ${{ steps.f.outputs.zf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36   # v3.0.2
        id: f
        with:
          filters: |
            shared:
              - '.github/**'
            pa238:
              - 'PA/**'
            bb8:
              - 'BB8/**'
            bb8-m8:
              - 'BB8/**'
              - 'BB9/verify_c04/**'
              - 'BB9/verify_fw2/multifile/**'
            bb13-bb14:
              - 'BB13/**'
              - 'BB14/**'
            bb9-fw2:
              - 'BB9/verify_fw2/**'
            bb9-c04:
              - 'BB9/verify_c04/**'
              - 'BB9/verify_fw2/multifile/**'
            bb43:
              - 'BB43/**'
            zf:
              - 'ZF/**'

      - id: all
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ] \
             || [ "${{ steps.f.outputs.shared }}" = true ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

  pa238:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.pa238 == 'true'
    # Exact blank-tape PA238 halting iff a finite ordinary classical PA refutation.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; ensure Python and ps
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          if ! command -v python3 >/dev/null || [ ! -x /bin/ps ]; then
            apt-get update && apt-get install -y python3 procps
          fi

      - uses: actions/checkout@v4

      - name: Provision absent compilation locks without replacing existing files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('/tmp/mm0-native-mac.lock', '/tmp/mm0_compile.lock'):
              try:
                  with Path(name).open('xb'):
                      pass
              except FileExistsError:
                  pass
          PY

      - name: Build PA238 and check closed assumptions
        run: python3 -I PA/m238/check.py --coqc coqc --wall-seconds 120 --memory-mib 2048

  bb8:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb8 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash   # bash -eo pipefail, so a failing coqc is not hidden by `| tee`
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Coq version
        run: coqc --version

      - name: Build busycoq (pinned commit, only the files BB8 depends on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          git log -1 --format='busycoq %H %ci %s'
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile the BB8 proofs
        working-directory: BB8/verify
        run: BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh 2>&1 | tee compile_ci.log

      - name: Check that the main theorems use no axioms
        working-directory: BB8/verify
        run: |
          coqc -Q "$RUNNER_TEMP/busycoq/verify" BusyCoq -Q . BB8 probe.v | tee probe_ci.log
          closed=$(grep -c 'Closed under the global context' probe_ci.log || true)
          echo "probe.v: $closed of 5 theorems closed under the global context"
          if grep -q 'Axioms:' probe_ci.log || [ "$closed" -ne 5 ]; then
            echo "::error::probe.v did not report five axiom-free theorems"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-logs
          path: |
            BB8/verify/compile_ci.log
            BB8/verify/probe_ci.log

  bb8-m8:
    # BB8/verify_m8: the 8-state machine M8 (1RB0RA_1LC1LF_1RD0LB_1RA1LE_1LH0LC_1RG1LD_0RG0RF_1RG---), the BB(8) entry,
    # the 8-state collapse of C04. Builds BB9/verify_c04 (all 55 files, about 1 h 40 min) and BB8/verify from scratch,
    # then the M8 layer and its probe (twenty results closed under the global context, twelve of them the theorems of
    # Statement.v).
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb8-m8 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile BB9/verify_c04, BB8/verify and BB8/verify_m8, and run the probes
        working-directory: BB8/verify_m8
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh deps 2>&1 | tee compile_ci.log
          closed=$(grep -c 'Closed under the global context' probe.log || true)
          if grep -q 'Axioms:' probe.log || [ "$closed" -ne 20 ]; then
            echo "::error::probe.v did not report twenty axiom-free results"
            exit 1
          fi
          tail -20 probe.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-logs-m8
          path: |
            BB8/verify_m8/compile_ci.log
            BB8/verify_m8/probe.log

  bb13-bb14:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb13-bb14 == 'true'
    # BB13/, BB14/: the 13- and 14-state f_(omega+2) machines M13 and M14 (about a minute each).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: ['13', '14']
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile BB${{ matrix.n }} and run the probe
        working-directory: BB${{ matrix.n }}/verify/multifile
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh 2>&1 | tee compile_ci.log
          closed=$(grep -c 'Closed under the global context' probe.log || true)
          if grep -q 'Axioms:' probe.log || [ "$closed" -ne 4 ]; then
            echo "::error::probe.v did not report four axiom-free theorems"
            exit 1
          fi

  bb9-fw2:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb9-fw2 == 'true'
    # BB9/verify_fw2: the 9-state f_omega(f_omega(465009)) machine fw2, stage 1 only (halt and score bounds, about a
    # minute). Stage 2 (the comparisons, which need the ~1 MB halting proofs of the earlier BB(9) machines) takes hours
    # and, like BB10/ and BB12/, is not built here; see BB9/verify_fw2/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile BB9/verify_fw2 (stage 1) and run the probe
        working-directory: BB9/verify_fw2/multifile
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh core 2>&1 | tee compile_ci.log
          closed=$(grep -c 'Closed under the global context' probe.log || true)
          if grep -q 'Axioms:' probe.log || [ "$closed" -ne 4 ]; then
            echo "::error::probe.v did not report four axiom-free theorems"
            exit 1
          fi

  bb9-c04:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb9-c04 == 'true'
    # BB9/verify_c04: the 9-state machine C04 (1RB0RA_1LC1LF_1RD0LB_1RA1LE_1LH0LC_0RG1LD_0LH1LH_1RI---_0RI0RF), the BB(9)
    # entry: all 56 files from scratch, 4 coqc at a time, then the probe (about 1 h 40 min on a 4-vCPU runner; the
    # longest file, k31/K_e1.v, takes most of it).
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Check that the fw2 files are the published ones
        run: |
          for f in BB92 Individual92 BB9_fw2_1RB0RD BB9_fw2_bound; do
            cmp BB9/verify_c04/lib/$f.v BB9/verify_fw2/multifile/$f.v
          done

      - name: Compile BB9/verify_c04 and run the probe
        working-directory: BB9/verify_c04
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" J=4 bash ./compile_clean.sh 2>&1 | tee compile_ci.log
          test "$(find lib dev k31 score fgh -name '*.vo' | wc -l)" -eq 56
          closed=$(grep -c 'Closed under the global context' probe.log || true)
          if grep -q 'Axioms:' probe.log || [ "$closed" -ne 5 ]; then
            echo "::error::probe.v did not report five axiom-free results"
            exit 1
          fi
          tail -20 probe.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-logs-c04
          path: |
            BB9/verify_c04/compile_ci.log
            BB9/verify_c04/probe.log
            BB9/verify_c04/_logs/

  bb43:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb43 == 'true'
    # BB43/: the BB(4,3) champion 1RB1RD1LC_2LB1RB1LC_1RZ1LA1LD_0RB2RA2RD (4 states, 3 symbols): halting, the exact
    # final tape and the bracket 2^^^2^^^2^^^(2^96-1) < e4 <= 2^^^2^^^2^^^(2^96+6) (about two minutes).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile BB43 and run the probe
        working-directory: BB43/verify
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh 2>&1 | tee compile_ci.log
          closed=$(grep -c 'Closed under the global context' probe.log || true)
          if grep -q 'Axioms:' probe.log || [ "$closed" -ne 13 ]; then
            echo "::error::probe.v did not report thirteen axiom-free theorems"
            exit 1
          fi

  zf:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.zf == 'true'
    # ZF/: the 393-, 361- and 354-state "halts iff ZF proves a contradiction" machines.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        machine: ['393', '361', '354', '336', '335']
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; install git and python3
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          if ! command -v git >/dev/null || ! command -v python3 >/dev/null; then
            apt-get update && apt-get install -y git python3
          fi

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, TM.v and its dependencies)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v
          make -f Makefile.coq TM.vo

      - name: Check the ${{ matrix.machine }}-state machine
        working-directory: ZF/verify
        run: BUSYCOQ="$RUNNER_TEMP/busycoq/verify" python3 check.py ${{ matrix.machine }} 2>&1 | tee check_${{ matrix.machine }}.log

  zf-stdzf:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.zf == 'true'
    # ZF/stdzf: O'Rear's system vs the Coq Library of Undecidability Proofs' ZF, regularity, and the
    # end-to-end theorem halts tm c0 <-> ZFc ⊢TC ⊥ for the 354-state machine. Self-contained (vendored).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; install python3
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)

      - uses: actions/checkout@v4

      - name: Build and check ZF/stdzf
        working-directory: ZF/stdzf
        run: python3 check.py 2>&1 | tee check_ci.log

  zf-stdzf-r3:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.zf == 'true'
    # ZF/stdzf_r3: the 335- and 336-state machines end to end against the Coq Library of Undecidability
    # Proofs' ZF (with/without regularity), plus the relative consistency of AC (zfc/): the 335-state
    # machine halts iff ZFC is inconsistent. Self-contained (vendored).
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; install python3
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)

      - uses: actions/checkout@v4

      - name: Build and check ZF/stdzf_r3
        working-directory: ZF/stdzf_r3
        run: python3 check.py 2>&1 | tee check_ci.log

  zf-m254:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.zf == 'true'
    # ZF/m254: Mira-Cult's 254-state machine zfc_254.tm halts iff ZF (resp. ZFC) is inconsistent, end to
    # end against the Coq Library of Undecidability Proofs' ZF. Uses ../stdzf and ../stdzf_r3 sources.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; install python3
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)

      - uses: actions/checkout@v4

      - name: Build and check ZF/m254
        working-directory: ZF/m254
        run: python3 check.py 2>&1 | tee check_ci.log

  zf-tg296:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.zf == 'true'
    # ZF/tg296: the 296-state machine m254tg_wade.tm halts iff ZFC + GU ("every set lies in a Grothendieck
    # universe") is inconsistent, end to end against the Coq Library of Undecidability Proofs' ZF.
    # Uses ../stdzf, ../stdzf_r3 and ../m254 sources, and ../generator (Wade's TMBuilder) for the rebuild check.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; install python3
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)

      - uses: actions/checkout@v4

      - name: Build and check ZF/tg296
        working-directory: ZF/tg296
        run: python3 check.py 2>&1 | tee check_ci.log
