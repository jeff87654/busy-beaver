name: Coq proofs

# Builds busycoq at the pinned commit with Coq 8.20.1 and checks the proofs of each entry: BB8/verify, BB8/verify_m8,
# BB9/verify_fw2 (stage 1), BB9/verify_c04, BB9/verify_f3, BB9/verify_c7, BB9/verify_h003, BB7/, BB7/holdouts, BB11/verify (without the n1 comparison), BB12/verify_m12, BB13/, BB14/, BB15/, BB16/, BB17/, BB18/, BB19/, BB20/, BB21/, BB25/, BB29/ to BB33/, BB34_2/, BB43/, BB53/, BB34/, BB44/, BB54/, PA/m238, PA/goldbach and ZF/. Not built here, because they take long
# (recorded local builds are in their directories): BB10/ (about 20 minutes), BB11/'s comparison with n1 (about 6 minutes), BB12/verify (about 3 hours) and stage 2 of
# BB9/verify_fw2 (about 2 hours).
#
# When the jobs run: on pull requests and on pushes to main, a job runs only if its entry's files, or the files of an
# entry it depends on, changed (job `changes`, below; a skipped job counts as passed). Changing this file, or only
# documentation (.md files: write-ups, READMEs), does not by itself run any job, so a pull request that adds an entry
# and its job runs that job only. Every job runs on manual runs (workflow_dispatch: Actions > Coq proofs > Run
# workflow) and in the weekly scheduled run.
#
# So after changing how a job builds without changing its entry's files (its steps, the container image, or the busycoq
# pin BUSYCOQ_COMMIT, which is set in each job below), run the workflow manually on the branch.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC: everything

jobs:
  changes:
    # Which entries a pull request or push touches. An entry's job also runs when an entry it depends on changes:
    # BB9/verify_c04 uses copies of BB9/verify_fw2/multifile files (checked byte for byte), so it runs when those change;
    # BB8/verify_m8 is built on BB9/verify_c04 and BB8/verify, so it runs when any of those change; BB9/verify_f3 ports
    # BB9/verify_c04's files (checked against them) and shares BB8/verify_m8/Defs.v's definitions (checked by diff).
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.all.outputs.all }}
      pa238: ${{ steps.f.outputs.pa238 }}
      pa-goldbach: ${{ steps.f.outputs.pa-goldbach }}
      bb8: ${{ steps.f.outputs.bb8 }}
      bb8-m8: ${{ steps.f.outputs.bb8-m8 }}
      bb13-bb14: ${{ steps.f.outputs.bb13-bb14 }}
      bb9-fw2: ${{ steps.f.outputs.bb9-fw2 }}
      bb9-c04: ${{ steps.f.outputs.bb9-c04 }}
      bb9-f3: ${{ steps.f.outputs.bb9-f3 }}
      bb9-c7: ${{ steps.f.outputs.bb9-c7 }}
      bb9-h003: ${{ steps.f.outputs.bb9-h003 }}
      bb43: ${{ steps.f.outputs.bb43 }}
      bb34: ${{ steps.f.outputs.bb34 }}
      bb44: ${{ steps.f.outputs.bb44 }}
      bb54: ${{ steps.f.outputs.bb54 }}
      bb53: ${{ steps.f.outputs.bb53 }}
      bb7: ${{ steps.f.outputs.bb7 }}
      bb7-holdouts: ${{ steps.f.outputs.bb7-holdouts }}
      zf: ${{ steps.f.outputs.zf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36   # v3.0.2
        id: f
        with:
          predicate-quantifier: 'every'
          # With 'every', a file selects a filter only if it matches every line of it: the first line is the
          # entry's paths (a {a,b,...} brace pattern is their union) and '!**/*.md' leaves out documentation, so a
          # change to .md files alone selects no job (no step a job runs reads a .md file).
          filters: |
            pa238:
              - 'PA/m238/**'
              - '!**/*.md'
            pa-goldbach:                  # uses ZF/generator (TMBuilder rebuild check) and the busycoq copy in ZF/stdzf_r3
              - '{PA/goldbach/**,ZF/generator/**,ZF/stdzf_r3/vendor/busycoq/**}'
              - '!**/*.md'
            bb8:
              - 'BB8/**'
              - '!**/*.md'
            bb8-m8:
              - '{BB8/**,BB9/verify_c04/**,BB9/verify_fw2/multifile/**}'
              - '!**/*.md'
            bb13-bb14:                    # also builds BB11/verify* (M11b, C4), BB12/verify_m12 (M12), BB15/verify, BB16/verify*, BB17/verify*, BB18/verify*, BB19/verify*, BB20/verify*, BB21/verify*, BB25/verify* and BB29/30/31/32/33/verify, BB34_2/verify
              - '{BB11/verify*/**,BB12/verify_m12/**,BB13/**,BB14/**,BB15/verify/**,BB16/verify*/**,BB17/verify*/**,BB18/verify*/**,BB19/verify*/**,BB20/verify*/**,BB21/verify*/**,BB25/verify*/**,BB29/verify/**,BB30/verify*/**,BB31/verify/**,BB32/verify*/**,BB33/verify/**,BB34_2/verify*/**}'
              - '!**/*.md'
            bb9-fw2:
              - 'BB9/verify_fw2/**'
              - '!**/*.md'
            bb9-c04:
              - '{BB9/verify_c04/**,BB9/verify_fw2/multifile/**}'
              - '!**/*.md'
            bb9-f3:
              - '{BB9/verify_f3/**,BB9/verify_c04/**,BB8/verify_m8/Defs.v}'
              - '!**/*.md'
            bb9-c7:                       # self-contained build; port_check.sh and the Defs.v diff read the others
              - '{BB9/verify_c7/**,BB9/verify_c04/{dev/Abs,dev/G_rules,dev/Lift,lib/BB92,lib/Individual92}.v,BB9/verify_f3/{lib/BB112,lib/Individual112,score/Score,dev/Base}.v,BB8/verify_m8/Defs.v}'
              - '!**/*.md'
            bb9-h003:                     # self-contained build; port_check.sh and the Defs.v diff read the others
              - '{BB9/verify_h003/**,BB9/verify_c04/lib/{BB92,Individual92}.v,BB9/verify_f3/{dev/Abs,dev/Cascade,dev/Endgame,dev/Fin,dev/G_entry,dev/G_p14_0,dev/G_p14_1,dev/G_p14_2,dev/G_p14_3,dev/G_p14_4,dev/G_p14_5,dev/G_p20_0,dev/G_p20_1,dev/G_p20_2,dev/G_p20_3,dev/G_p20_4,dev/G_p20_5,dev/G_rules,dev/G_stop,dev/G_sub2,dev/G_sub3,dev/G_sub4,dev/G_sub5,dev/Lift,dev/Orbit,dev/Step,k31/K_e1,k31/K_e2,k31/K_rf,k31/K31_Abs,lib/BB112,lib/Individual112,score/Score,dev/G_end,k31/K_x,dev/CBtail,k31/K31_Mach,k31/K31_End}.v,BB9/verify_c7/{dev/G_pbab,dev/G_pbc,dev/KStep,dev/Ones,dev/Res,dev/Base,c7/Defs}.v,BB8/verify_m8/Defs.v}'
              - '!**/*.md'
            bb43:
              - 'BB43/**'
              - '!**/*.md'
            bb34:
              - 'BB34/**'
              - '!**/*.md'
            bb44:
              - 'BB44/**'
              - '!**/*.md'
            bb54:
              - 'BB54/**'
              - '!**/*.md'
            bb53:                         # BB53/verify_cmp also loads BB43/verify and a copy of BB31/verify/multifile/Ord.v
              - '{BB53/**,BB43/verify/**,BB31/verify/multifile/Ord.v}'
              - '!**/*.md'
            bb7:
              - 'BB7/**'
              - '!BB7/holdouts/**'
              - '!**/*.md'
            bb7-holdouts:                 # compares its BB72.v / Individual72.v with BB7/verify's copies
              - '{BB7/holdouts/**,BB7/verify/BB72.v,BB7/verify/Individual72.v}'
              - '!**/*.md'
            zf:
              - 'ZF/**'
              - '!**/*.md'

      - id: all
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

  pa238:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.pa238 == 'true'
    # Exact blank-tape PA238 halting iff a finite ordinary classical PA refutation.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; ensure Python and ps
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          if ! command -v python3 >/dev/null || [ ! -x /bin/ps ]; then
            apt-get update && apt-get install -y python3 procps
          fi

      - uses: actions/checkout@v4

      - name: Provision absent compilation locks without replacing existing files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('/tmp/mm0-native-mac.lock', '/tmp/mm0_compile.lock'):
              try:
                  with Path(name).open('xb'):
                      pass
              except FileExistsError:
                  pass
          PY

      - name: Build PA238 and check closed assumptions
        run: python3 -I PA/m238/check.py --coqc coqc --wall-seconds 120 --memory-mib 2048

  pa-goldbach:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.pa-goldbach == 'true'
    # PA/goldbach: the 449-state machine pa_wade.tm halts iff PA proves Goldbach's conjecture
    # (PAeq ⊢TC GC_form, the Coq Library of Undecidability Proofs' PA), end to end, with coqchk.
    # Uses ../../ZF/generator (Wade's TMBuilder) for the rebuild check and ../../ZF/stdzf_r3/vendor/busycoq.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH; install python3
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)

      - uses: actions/checkout@v4

      - name: Build and check PA/goldbach
        working-directory: PA/goldbach
        run: python3 check.py 2>&1 | tee check_ci.log

  bb8:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb8 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash   # bash -eo pipefail, so a failing coqc is not hidden by `| tee`
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Coq version
        run: coqc --version

      - name: Build busycoq (pinned commit, only the files BB8 depends on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          git log -1 --format='busycoq %H %ci %s'
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile the BB8 proofs
        working-directory: BB8/verify
        run: BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh 2>&1 | tee compile_ci.log

      - name: Check that the main theorems use no axioms
        working-directory: BB8/verify
        run: |
          coqc -Q "$RUNNER_TEMP/busycoq/verify" BusyCoq -Q . BB8 probe.v | tee probe_ci.log
          closed=$(grep -c 'Closed under the global context' probe_ci.log || true)
          echo "probe.v: $closed of 5 theorems closed under the global context"
          if grep -q 'Axioms:' probe_ci.log || [ "$closed" -ne 5 ]; then
            echo "::error::probe.v did not report five axiom-free theorems"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-logs
          path: |
            BB8/verify/compile_ci.log
            BB8/verify/probe_ci.log

  bb8-m8:
    # BB8/verify_m8: the 8-state machine M8 (1RB0RA_1LC1LF_1RD0LB_1RA1LE_1LH0LC_1RG1LD_0RG0RF_1RG---), the BB(8) entry,
    # the 8-state collapse of C04. Builds BB9/verify_c04 (all 56 files, about 1 h 40 min) and BB8/verify from scratch,
    # then the M8 layer and its probe (twenty results closed under the global context, twelve of them the theorems of
    # Statement.v).
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb8-m8 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile BB9/verify_c04, BB8/verify and BB8/verify_m8, and run the probes
        working-directory: BB8/verify_m8
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh deps 2>&1 | tee compile_ci.log
          closed=$(grep -c 'Closed under the global context' probe.log || true)
          if grep -q 'Axioms:' probe.log || [ "$closed" -ne 20 ]; then
            echo "::error::probe.v did not report twenty axiom-free results"
            exit 1
          fi
          tail -20 probe.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-logs-m8
          path: |
            BB8/verify_m8/compile_ci.log
            BB8/verify_m8/probe.log

  bb13-bb14:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb13-bb14 == 'true'
    # BB11/verify (M11b, f_(omega+1); its comparison with n1 is not built here), BB11/verify_c4 (C4, the 11-state
    # f_(omega+2)^2 machine, with copies of M11b's and M12's proofs for its comparisons), BB12/verify_m12, BB13/, BB14/: the 12-,
    # 13- and 14-state f_(omega+2) machines M12, M13, M13b, M13_19, M14, M14b, M14d_18 and M14_31 and the 14-state
    # f_(omega+3) machine M14_fw3 (verify_m13_19 and verify_m14_fw3 also compare with M13b's and M14_31's exact
    # scores, loading byte-identical copies of their proofs), BB15/verify (Argon's 15-state
    # f_(omega+13) machine J15_fw13), BB16/verify_j16 (Argon's 16-state f_(omega*2) machine J16_w2), BB16/verify*, BB17/verify and
    # BB18/verify* (the 16- to 18-state f_(omega+3) machines M16_B, M16_C, M17_B, BB18_fw3, M18_4round and M18_229round,
    # and R18a, the 18-state f_(omega*2) machine derived from J20, and BB18/verify_j18c, Argon's 18-state f_(omega*2) machine J18_w2_C),
    # BB19/verify* (the 19-state f_(omega+4) machines M19_fw4 and M19_fw4_A, and Jacobzheng's f_(omega+7)^2 machine J19),
    # BB20/verify (Jacobzheng's 20-state f_(omega*2) machine J20), BB17/verify_j17, BB18/verify_r18c, BB19/verify_j19sq and
    # BB20/verify_j20cube (J17_champ, R18c, J19_sq and J20_cube: 17- to 20-state machines at f_(omega*2), f_(omega*2)^2
    # and f_(omega*2)^3 on Jacobzheng's engine, Coq proofs by Argon; each also compares with the exact scores of the
    # machines it replaces, loading byte-identical copies of their proofs and the generic bounds JZ_UB.v), BB21/verify (Racheline's 21-state machine B21: halt and
    # 4^^341 < sigma, about 2 minutes; BB21/verify_w2: its omega^2 bound, with copies of the B21, J20 and R18a proofs,
    # about 5 minutes), BB25/verify (W2PR, B21 with a mod-8 refill; seven files shared with BB21/verify,
    # checked by its share_check.sh; about 3 minutes; BB25/verify_w2: its omega^2 bound, with copies of
    # verify/ and BB21/verify_w2, about 5 minutes), and BB29/31/33/verify (mxdys's hydra machines, below epsilon_0) and
    # BB30/32/verify, BB34_2/verify (Argon's 30-, 32- and 34-state hydra machines; BB34_2 because BB34/ is BB(3,4)) (about
    # a minute each), and BB30/verify_vs29, BB32/verify_vs31, BB34_2/verify_vs33 (upper bounds for hydra29's, hydra31's and
    # hydra33's scores and the comparisons with hydra30, hydra32 and hydra34, on byte-identical copies of both machines' files). The job id is historical.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dir: ['BB11/verify/multifile', 'BB11/verify_c4/multifile', 'BB12/verify_m12/multifile', 'BB13/verify/multifile', 'BB13/verify_m13b/multifile',
              'BB13/verify_m13_19/multifile',
              'BB14/verify/multifile', 'BB14/verify_m14b/multifile', 'BB14/verify_m14d/multifile',
              'BB14/verify_m14_31/multifile', 'BB14/verify_m14_fw3/multifile', 'BB15/verify/multifile',
              'BB16/verify/multifile', 'BB16/verify_m16c/multifile', 'BB16/verify_j16/multifile', 'BB17/verify/multifile',
              'BB17/verify_j17/multifile',
              'BB18/verify/multifile', 'BB18/verify_m18r4/multifile', 'BB18/verify_m18r229/multifile',
              'BB18/verify_r18a/multifile', 'BB18/verify_j18c/multifile', 'BB18/verify_r18c/multifile',
              'BB19/verify/multifile', 'BB19/verify_m19a/multifile', 'BB19/verify_jz19/multifile', 'BB19/verify_j19sq/multifile',
              'BB20/verify/multifile', 'BB20/verify_j20cube/multifile', 'BB21/verify/multifile', 'BB21/verify_w2/multifile',
              'BB25/verify/multifile', 'BB25/verify_w2/multifile',
              'BB29/verify/multifile', 'BB30/verify/multifile', 'BB31/verify/multifile', 'BB32/verify/multifile',
              'BB33/verify/multifile', 'BB34_2/verify/multifile', 'BB32/verify_vs31/multifile',
              'BB34_2/verify_vs33/multifile', 'BB30/verify_vs29/multifile']
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile ${{ matrix.dir }} and run the probe
        working-directory: ${{ matrix.dir }}
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh 2>&1 | tee compile_ci.log
          # one 'Closed under the global context' per Print Assumptions line of probe.v (3 for M13b/M14b, 4 for
          # M12-M14, M14d_18, BB16, BB17, BB18 and BB19, 3 for M18_4round, M18_229round, M19_fw4_A, J19, J20, B21 and W2PR, 4 for W2PR's verify_w2, 5 for R18a, B21's verify_w2, J15_fw13, J18_w2_C and J20_cube, 6 for M11b, M16_C and M14_31, 7 for J16_w2, J17_champ and J19_sq, 9 for C4, M13_19, M14_fw3 and R18c)
          expected=$(grep -c '^Print Assumptions' probe.v)
          closed=$(grep -c 'Closed under the global context' probe.log || true)
          if grep -q 'Axioms:' probe.log || [ "$expected" -lt 3 ] || [ "$closed" -ne "$expected" ]; then
            echo "::error::probe.v did not report $expected axiom-free theorems"
            exit 1
          fi

  bb9-fw2:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.bb9-fw2 == 'true'
    # BB9/verify_fw2: the 9-state f_omega(f_omega(465009)) machine fw2, stage 1 only (halt and score bounds, about a
    # minute). Stage 2 (the comparisons, which need the ~1 MB halting proofs of the earlier BB(9) machines) takes hours
    # and, like BB10/ and BB12/, is not built here; see BB9/verify_fw2/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: coqorg/coq:8.20.1
      options: --user root
    env:
      BUSYCOQ_COMMIT: bd2e36f6aa204eb011742d2ca6c8741102b2e59e
    defaults:
      run:
        shell: bash
    steps:
      - name: Put the image's opam switch on PATH
        run: |
          if ! command -v coqc >/dev/null; then
            dirname "$(ls -d /home/coq/.opam/*/bin/coqc | head -1)" >> "$GITHUB_PATH"
          fi
          command -v git >/dev/null || (apt-get update && apt-get install -y git)

      - uses: actions/checkout@v4

      - name: Build busycoq (pinned commit, only the files the proofs depend on)
        run: |
          git clone https://github.com/meithecatte/busycoq "$RUNNER_TEMP/busycoq"
          cd "$RUNNER_TEMP/busycoq"
          git checkout "$BUSYCOQ_COMMIT"
          cd verify
          coq_makefile -Q . BusyCoq -o Makefile.coq LibTactics.v Helper.v TM.v Compute.v Flip.v Permute.v Individual.v
          make -f Makefile.coq Individual.vo Flip.vo

      - name: Compile BB9/verify_fw2 (stage 1) and run the probe
        working-directory: BB9/verify_fw2/multifile
        run: |
          BUSYCOQ="$RUNNER_TEMP/busycoq/verify" bash ./compile_clean.sh core 2>&1 | tee compile_ci.log
          closed=$(grep -c 'Closed under the global context' probe.log || true)
