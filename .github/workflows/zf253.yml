name: ZF253 Coq proof

# Runs only when files under ZF/ change (ZF/m253/check.py also reads ZF/m254 and the shared ZF libraries).
# Changing this file alone does not run it; after changing its steps or image, run it manually
# (Actions > ZF253 Coq proof > Run workflow).
on:
  push:
    paths: ['ZF/**']
  pull_request:
    paths: ['ZF/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zf253:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Official registry manifest for coqorg/coq:8.20.1; SHA256 verified.
      image: coqorg/coq:8.20.1@sha256:18ebf3da56e60e3ddfd7d4e51f4c53d10241a129f34e93dacbc71562dd43c57a
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Expose the image's Coq switch and ensure Python and ps
        run: |
          if ! command -v coqc >/dev/null; then
            shopt -s nullglob
            compilers=(/home/coq/.opam/*/bin/coqc)
            if [ "${#compilers[@]}" -eq 0 ]; then
              echo '::error::The pinned image contains no Coq compiler'
              exit 1
            fi
            dirname "${compilers[0]}" >> "$GITHUB_PATH"
          fi
          if ! command -v python3 >/dev/null || ! command -v ps >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends python3 procps
          fi

      - name: Check out the event's source
        # actions/checkout v4.2.2, verified through its upstream tag reference.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build, audit every assumption probe, and recursively check the kernel objects
        run: |
          printf '%s  %s\n' \
            '84a21f714017c1d491008d86e9bd19c43cc6c5c9ae99a538b4f2314387827d95' \
            'ZF/m253/machine/zfc_253.tm' | sha256sum --check
          python3 -I -B ZF/m253/check.py --coqc coqc \
            --wall-seconds 900 --memory-mib 1536 --coqchk-seconds 900 \
            2>&1 | tee "$RUNNER_TEMP/zf253-check.log"
          grep -Fxq 'dependency closure: 160 source files; 194 Print Assumptions probes' \
            "$RUNNER_TEMP/zf253-check.log"
          grep -Eq '^recursive coqchk PASS: 160 module roots and all recursive dependencies;' \
            "$RUNNER_TEMP/zf253-check.log"
          grep -Eq '^CHECK PASS: 194 closed reports;' "$RUNNER_TEMP/zf253-check.log"
